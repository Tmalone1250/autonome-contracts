[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "shanghai" # REQUIRED: Prevents unsupported Cancun opcodes on BOT Chain
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
bot_testnet = "https://rpc.bohr.life"
bot_mainnet = "https://rpc.botchain.ai"

[etherscan]
# If using a blockscout/custom explorer verification endpoint
bot_testnet = { key = "none", url = "https://scan.bohr.life/api" }